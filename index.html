<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuma Tanemura — Illustrator &amp; Designer</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="description" content="Illustrator and designer based in Japan. Open for commissions and collaborations — say hello.">
  <link rel="canonical" href="https://yumatanemura.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yumatanemura.com/">
  <meta property="og:site_name" content="Yuma Tanemura">
  <meta property="og:title" content="Yuma Tanemura — Illustrator &amp; Designer">
  <meta property="og:description" content="Illustrator and designer based in Japan. Open for commissions and collaborations — say hello.">
  <meta property="og:image" content="https://yumatanemura.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="yuma.tanemura on a flesh TV">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://yumatanemura.com/#website",
        "url": "https://yumatanemura.com/",
        "name": "Yuma Tanemura",
        "publisher": { "@id": "https://yumatanemura.com/#person" }
      },
      {
        "@type": "Person",
        "@id": "https://yumatanemura.com/#person",
        "name": "Yuma Tanemura",
        "alternateName": "yuma.tanemura",
        "jobTitle": ["Illustrator", "Designer"],
        "url": "https://yumatanemura.com/",
        "homeLocation": { "@type": "Country", "name": "Japan" },
        "sameAs": [
          "https://github.com/uma-moebius"
        ]
      }
    ]
  }
  </script>
  <meta name="theme-color" content="#141018">
  <link rel="preload" href="/assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/baloo2-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="./assets/js-flag.js"></script>
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./assets/ascii.css">
  <link rel="stylesheet" href="./assets/tv.css">
</head>
<body>
  <div class="sun-cursor" aria-hidden="true"></div>
  <canvas class="flesh__canvas" aria-hidden="true"></canvas>
  <header class="site-header">
    <div class="shell">
      <a class="logo" href="./">yumatanemura.com</a>
      <nav class="nav" aria-label="Primary">
        <a href="#about">About</a>
        <a href="#works">Works</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="shell hero">
      <canvas class="hero__canvas" aria-hidden="true"></canvas>
      <h1 class="wordmark">yuma.tanemura</h1>
    </div>

    <div class="scene">
      <div class="scene__bg" aria-hidden="true">
        <canvas class="scene__canvas"></canvas>
        <canvas class="birth__canvas"></canvas>
      </div>

      <section class="sunsec" id="about" aria-labelledby="about-label">
        <div class="sunsec__pin">
          <button class="back" type="button" hidden>Back</button>
          <h2 class="sr-only" id="about-label">About</h2>
          <div class="status">
            <dl class="status__stats">
              <div class="status__row"><dt>NAME</dt><dd>Yuma Tanemura</dd></div>
              <div class="status__row"><dt>CLASS</dt><dd>Illustrator / Designer</dd></div>
              <div class="status__row"><dt>HOME</dt><dd>Japan</dd></div>
              <div class="status__row"><dt>LINK</dt><dd><a class="status__link" href="https://github.com/uma-moebius" target="_blank" rel="noopener noreferrer">GitHub</a></dd></div>
            </dl>
            <div class="status__portrait" id="portrait-stage"><img id="portrait-img" alt="" decoding="async"></div>
          </div>
        </div>
      </section>

      <section class="works" id="works" aria-label="Works">
        <div class="works__pin">
          <button class="back" type="button" hidden>Back</button>
          <ol class="works__index" id="works-index" aria-label="Works index"></ol>
          <div class="works__stage" id="works-stage"><img alt="" decoding="async"></div>
          <p class="works__empty" id="works-empty">NO DATA</p>
          <p class="sr-only" id="works-status" aria-live="polite"></p>
        </div>
      </section>
    </div>

    <div class="shell">
      <section class="contact" id="contact" aria-label="Contact">
        <div class="contact__layout">
          <button class="back" type="button" hidden>Back</button>
            <a class="contact__mail" href="mailto:hello@yumatanemura.com">hello@yumatanemura.com</a>
        </div>
      </section>
    </div>
  </main>
  <div class="tv" id="tv" hidden>
    <div class="tv__title" id="tv-title">
      <p class="tv__name">yuma.tanemura</p>
      <button class="tv__start" type="button">PRESS START</button>
    </div>
    <nav class="tv__menu" id="tv-menu" aria-label="Menu" hidden>
      <button class="tv__item" type="button" data-screen="about"><span class="tv__mark" aria-hidden="true"></span>About</button>
      <button class="tv__item" type="button" data-screen="works"><span class="tv__mark" aria-hidden="true"></span>Works</button>
      <button class="tv__item" type="button" data-screen="contact"><span class="tv__mark" aria-hidden="true"></span>Contact</button>
    </nav>
  </div>
  <canvas class="tv__noise" id="tv-noise" hidden aria-hidden="true"></canvas>

  <footer class="site-footer">
    <canvas class="dusk" aria-hidden="true"></canvas>
    <p>(C) Yuma Tanemura 2026</p>
  </footer>

  <script src="./assets/ascii.js"></script>
  <script src="./assets/flesh.js"></script>
  <script src="./assets/works-data.js"></script>
  <script src="./assets/works.js"></script>
  <script src="./assets/gl-field.js"></script>
  <script src="./assets/birth.js"></script>
  <script src="./assets/tv.js"></script>
  <script src="./assets/scene.js"></script>
  <script src="./assets/ripple.js"></script>
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "2049c5c9cd2f4ea08d89f3d93ec42ae2"}'></script>
</body>
</html>
