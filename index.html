<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuma Tanemura</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <meta name="description" content="Yuma Tanemura, illustrator and designer based in Japan.">
  <meta name="theme-color" content="#141018">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add("js")</script>
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./assets/ascii.css">
</head>
<body>
  <header class="site-header">
    <div class="shell">
      <a class="logo" href="./">yumatanemura.com</a>
      <nav class="nav" aria-label="Primary">
        <a href="#about">About</a>
        <a href="#works">Works</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="shell">
      <h1 class="wordmark" aria-label="yuma.tanemura">
        <span class="wordmark__run" aria-hidden="true"><span class="wordmark__ch" style="--i:0">y</span><span class="wordmark__ch" style="--i:1">u</span><span class="wordmark__ch" style="--i:2">m</span><span class="wordmark__ch" style="--i:3">a</span><span class="wordmark__ch" style="--i:4">.</span><span class="wordmark__ch" style="--i:5">t</span><span class="wordmark__ch" style="--i:6">a</span><span class="wordmark__ch" style="--i:7">n</span><span class="wordmark__ch" style="--i:8">e</span><span class="wordmark__ch" style="--i:9">m</span><span class="wordmark__ch" style="--i:10">u</span><span class="wordmark__ch" style="--i:11">r</span><span class="wordmark__ch" style="--i:12">a</span></span>
      </h1>
    </div>

    <div class="scene">
      <div class="scene__bg" aria-hidden="true">
        <canvas class="scene__canvas"></canvas>
        <div class="scene__ring"></div>
      </div>

      <section class="sunsec" id="about" aria-labelledby="about-label">
        <div class="sunsec__pin">
          <h2 class="section-label sunsec__label" id="about-label">About</h2>
          <p class="sunsec__bio">Yuma Tanemura<br>Illustrator / Designer<br>Based in Japan</p>
          <p class="sunsec__links">
            <a href="https://www.instagram.com/yuma.tanemura/" target="_blank" rel="noopener noreferrer">Instagram</a><br>
            <a href="https://github.com/uma-moebius" target="_blank" rel="noopener noreferrer">GitHub</a>
          </p>
          <p class="sunsec__readout" aria-hidden="true">06:00 · ALT 00° · AZ 090°</p>
        </div>
      </section>
    </div>

    <div class="shell">
      <section class="works" id="works" aria-labelledby="works-label">
        <h2 class="section-label" id="works-label">Works</h2>
        <div class="works__grid" id="works-grid" data-side="left">
          <button type="button" class="works__frame" data-fill="stage" data-place="large" aria-current="true" aria-label="Featured work" tabindex="-1"></button>
          <button type="button" class="works__frame" data-fill="stage-top" data-place="top" aria-label="Show the upper work larger"></button>
          <button type="button" class="works__frame" data-fill="stage-bottom" data-place="bottom" aria-label="Show the lower work larger"></button>
        </div>
      </section>

      <section class="contact" id="contact" aria-labelledby="contact-heading">
        <div class="contact__layout">
          <div class="contact__intro">
            <h2 class="contact__heading" id="contact-heading">For commissions or collaborations.</h2>
            <a class="contact__mail" href="mailto:hello@yumatanemura.com">hello@yumatanemura.com</a>
          </div>
          <form class="contact__form" id="contact-form" action="https://formspree.io/f/mbgdrwba" method="POST">
            <input type="hidden" name="_next" value="https://yumatanemura.com/thank-you/">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="4" placeholder="What it is, and when it needs to exist." required></textarea>
            </div>
            <p class="form-error" id="form-error" role="alert" hidden></p>
            <button class="send" type="submit">Send</button>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>(C) Yuma Tanemura 2026</p>
  </footer>

  <script src="./assets/config.js"></script>
  <script src="./assets/main.js"></script>
  <script src="./assets/ascii.js"></script>
  <script src="./assets/scene.js"></script>
</body>
</html>
