            <a href="https://www.instagram.com/yuma.tanemura/" target="_blank" rel="noopener noreferrer">Instagram</a><br>

      </section>

      <section class="works" id="works" aria-labelledby="works-label">
        <h2 class="section-label" id="works-label">Works</h2>
        <div class="works__grid" id="works-grid" data-side="left">
          <button type="button" class="works__frame" data-fill="stage" data-place="large" aria-current="true" aria-label="Featured work" tabindex="-1"></button>
          <button type="button" class="works__frame" data-fill="stage-top" data-place="top" aria-label="Show the upper work larger"></button>
          <button type="button" class="works__frame" data-fill="stage-bottom" data-place="bottom" aria-label="Show the lower work larger"></button>
        </div>
      </section>

      <section class="contact" id="contact" aria-labelledby="contact-heading">
        <div class="contact__layout">
          <div class="contact__intro">
            <h2 class="contact__heading" id="contact-heading">For commissions or collaborations.</h2>
            <a class="contact__mail" href="mailto:hello@yumatanemura.com">hello@yumatanemura.com</a>
          </div>
          <form class="contact__form" id="contact-form" action="https://formspree.io/f/mbgdrwba" method="POST">
            <input type="hidden" name="_next" value="https://yumatanemura.com/thank-you/">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="4" placeholder="What it is, and when it needs to exist." required></textarea>
            </div>
            <p class="form-error" id="form-error" role="alert" hidden></p>
            <button class="send" type="submit">Send</button>
          </form>
        </div>
      </section>
    </div>

  <footer class="site-footer">
    <p>(C) Yuma Tanemura 2026</p>
  </footer>

  <script src="./assets/config.js"></script>
  <script src="./assets/main.js"></script>
